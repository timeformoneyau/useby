# Scan one item the stand-in proxy reads cleanly, in Single Item mode (the
# default): the camera returns Home as soon as the photo is taken, the draft
# appears on Home and fills in when its answer arrives, and it is saved from
# Review & Save. Ends on Home with the item in the list.
#   FIXTURE  which canned answer (e2e/app/scenarios.ts)
#   NAME     the item name that answer carries
appId: com.useby.app
---
- runFlow:
    file: open-camera.yaml
    env:
      FIXTURE: ${FIXTURE}
- tapOn: "Capture"
# Straight back to Home; nothing waits for the answer.
- extendedWaitUntil:
    visible: "Scan item"
    timeout: 10000
- extendedWaitUntil:
    visible: "${NAME}"
    timeout: 15000
- tapOn: "${NAME}"
- assertVisible: "Here's what we found"
- tapOn: "Save item"
- extendedWaitUntil:
    visible: "Scan item"
    timeout: 10000
- extendedWaitUntil:
    visible: "${NAME}"
    timeout: 10000
