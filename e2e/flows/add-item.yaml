# MUST-HAVE 1: add an item by scanning a label.
#
# The camera and the proxy are stand-ins (see e2e/README.md); everything in
# between — resize, request, the pending-scan queue, response mapping, the
# editor, saving — is the real app code.
#
# Single Item mode (the default): the camera returns Home as soon as the photo
# is taken; the draft fills in on Home and is reviewed from there.
appId: com.useby.app
name: Add an item by scanning
tags:
  - must-have
---
- runFlow: common/launch-clean.yaml

# A clean read: draft on Home, editor prefilled, saved to the list with its photo.
- runFlow:
    file: common/scan-and-save.yaml
    env:
      FIXTURE: milk
      NAME: Milk
- assertVisible: "6 days left"
- assertVisible: "Later"
- assertVisible: "Photo of Milk"

# The photo defeated the model: the draft says so, and the editor opens empty
# so the person types it in.
- runFlow:
    file: common/open-camera.yaml
    env:
      FIXTURE: unreadable
- tapOn: "Capture"
- extendedWaitUntil:
    visible: "Couldn't read that one"
    timeout: 15000
- tapOn: "Couldn't read that one"
- assertVisible: "We couldn't read that one"
- tapOn:
    id: "item-name-input"
- inputText: "Butter"
- pressKey: Enter   # "Done": closes the keyboard; hideKeyboard presses Back on Android
- tapOn: "Save item"
- extendedWaitUntil:
    visible: "Butter"
    timeout: 10000

# The scanner is down: the editor says so plainly. Backing out keeps the draft
# — nothing is lost — and it is finished by hand from Home.
- runFlow:
    file: common/open-camera.yaml
    env:
      FIXTURE: server-error
- tapOn: "Capture"
- extendedWaitUntil:
    visible: "Couldn't read that one"
    timeout: 20000
- tapOn: "Couldn't read that one"
- assertVisible: "The scanner is unavailable right now. Type it in for the moment."
- tapOn: "Back"
- assertVisible: "JUST SCANNED"
- assertVisible: "Butter"
- tapOn: "Couldn't read that one"
- assertVisible: "The scanner is unavailable right now. Type it in for the moment."
- tapOn:
    id: "item-name-input"
- inputText: "Eggs"
- pressKey: Enter
- tapOn: "Save item"
- extendedWaitUntil:
    visible: "Eggs"
    timeout: 10000
- assertNotVisible: "JUST SCANNED"

# No photo at all. The row shows the intentional placeholder, not a gap.
- tapOn: "Add without a photo"
- assertVisible: "Add an item"
- tapOn:
    id: "item-name-input"
- inputText: "Bread"
- pressKey: Enter
- tapOn: "Save item"
- extendedWaitUntil:
    visible: "Bread"
    timeout: 10000
- assertVisible: "No photo"
- assertVisible: "Milk"
- assertVisible: "Butter"
- assertVisible: "Eggs"
