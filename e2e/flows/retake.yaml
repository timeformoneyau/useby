# Retake replaces the draft it was opened from. It never adds a second one.
#
# Two entry paths. From a Home draft (Single Item mode): Retake opens the
# camera, the replacement photo goes straight back Home, and Home holds one
# draft. From the camera's result card (Multiple Items mode): Retake returns
# to the camera already open — no second camera — and Finish reaches Home.
appId: com.useby.app
name: Retake replaces the draft, from Home or from the camera card
tags:
  - must-have
---
# --- From a Home draft, Single Item mode ------------------------------------
- runFlow: common/launch-clean.yaml
- runFlow:
    file: common/open-camera.yaml
    env:
      FIXTURE: milk
- tapOn: "Capture"
- extendedWaitUntil:
    visible: "Scan item"
    timeout: 10000
- extendedWaitUntil:
    visible: "Milk"
    timeout: 15000
- tapOn: "Milk"
- assertVisible: "Here's what we found"

# Wrong pack. Retake from the editor.
- tapOn: "Retake"
- extendedWaitUntil:
    visible: "Replacing this scan"
    timeout: 10000
- runFlow:
    file: common/shoot.yaml
    env:
      FIXTURE: yoghurt
# Single Item: back Home with the photo; the draft fills in there.
- extendedWaitUntil:
    visible: "Scan item"
    timeout: 10000
- extendedWaitUntil:
    visible: "Greek yoghurt"
    timeout: 15000
- assertVisible: "JUST SCANNED"
- assertNotVisible: "Milk"

# Saving it gives one item.
- tapOn: "Greek yoghurt"
- assertVisible: "Here's what we found"
- tapOn: "Save item"
- extendedWaitUntil:
    visible: "2 days left"
    timeout: 10000
- assertNotVisible: "JUST SCANNED"
- assertNotVisible: "Milk"

# --- From the camera's result card, Multiple Items mode ---------------------
- runFlow: common/launch-clean.yaml
- runFlow:
    file: common/open-camera.yaml
    env:
      FIXTURE: milk
- tapOn: "Multiple items"
- tapOn: "Capture"
- extendedWaitUntil:
    visible: "Milk"
    timeout: 15000
- tapOn: "Milk"
- assertVisible: "Here's what we found"
- tapOn: "Retake"
# Back on the camera that was already open, still in Multiple Items.
- extendedWaitUntil:
    visible: "Replacing this scan"
    timeout: 10000
# The photo being replaced is not offered on the card any more.
- assertNotVisible: "Milk"
- runFlow:
    file: common/shoot.yaml
    env:
      FIXTURE: yoghurt
- extendedWaitUntil:
    visible: "Greek yoghurt"
    timeout: 15000
- assertNotVisible: "Replacing this scan"
- assertVisible: "1 to review"

# Save it from the card: back on the camera, still in Multiple Items.
- tapOn: "Greek yoghurt"
- assertVisible: "Here's what we found"
- tapOn: "Save item"
- extendedWaitUntil:
    visible: "Capture"
    timeout: 10000

# The retake was spent on one photo, so the next shot is an ordinary new item,
# and the camera stays open for it.
- runFlow:
    file: common/shoot.yaml
    env:
      FIXTURE: cheese
- extendedWaitUntil:
    visible: "Cheddar"
    timeout: 15000
- assertVisible: "1 to review"

# Finish goes straight to Home: there is no second camera underneath.
- tapOn: "Finish"
- extendedWaitUntil:
    visible: "Scan item"
    timeout: 10000
- assertNotVisible: "Capture"
- assertVisible: "JUST SCANNED"
- assertVisible: "Cheddar"
- assertVisible: "Greek yoghurt"
- assertNotVisible: "Milk"
