# Retake replaces the draft it was opened from. It never adds a second one.
#
# The bug this guards: Retake used to open a bare camera, the new photo got a
# new scan id, and one physical pack became two rows. Now the camera is told
# which draft the next photo replaces.
appId: com.useby.app
name: Retake replaces the draft, from Home or from the camera card
tags:
  - must-have
---
- runFlow: common/launch-clean.yaml
- runFlow:
    file: common/open-camera.yaml
    env:
      FIXTURE: milk
- tapOn: "Capture"
- extendedWaitUntil:
    visible: "Milk"
    timeout: 15000

# First path: reviewed later, from Home.
- runFlow: common/close-camera.yaml
- assertVisible: "JUST SCANNED"
- tapOn: "Milk"
- assertVisible: "Here's what we found"

# Wrong pack. Retake from the editor.
- tapOn: "Retake"
- extendedWaitUntil:
    visible: "Replacing this scan"
    timeout: 10000
- runFlow:
    file: common/shoot.yaml
    env:
      FIXTURE: yoghurt
- extendedWaitUntil:
    visible: "Greek yoghurt"
    timeout: 15000
# The retake state is spent on that one photo.
- assertNotVisible: "Replacing this scan"
- assertVisible: "1 to review"

# Home holds exactly one draft, and it is the retake.
- runFlow: common/close-camera.yaml
- assertVisible: "JUST SCANNED"
- assertVisible: "Greek yoghurt"
- assertNotVisible: "Milk"

# Saving it gives one item.
- tapOn: "Greek yoghurt"
- assertVisible: "Here's what we found"
- tapOn: "Save item"
- extendedWaitUntil:
    visible: "2 days left"
    timeout: 10000
- assertNotVisible: "JUST SCANNED"
- assertNotVisible: "Milk"

# ---------------------------------------------------------------------------
# The same, from the camera's result card.
#
# Retake from an editor opened off the card used to stack a second camera on
# the first, so "Done" landed on the earlier camera instead of Home. It now
# returns to the camera already open.
- runFlow: common/launch-clean.yaml
- runFlow:
    file: common/open-camera.yaml
    env:
      FIXTURE: milk
- tapOn: "Capture"
- extendedWaitUntil:
    visible: "Milk"
    timeout: 15000
- tapOn: "Milk"
- assertVisible: "Here's what we found"
- tapOn: "Retake"
- extendedWaitUntil:
    visible: "Replacing this scan"
    timeout: 10000
# The photo being replaced is not offered on the card any more.
- assertNotVisible: "Milk"
- runFlow:
    file: common/shoot.yaml
    env:
      FIXTURE: yoghurt
- extendedWaitUntil:
    visible: "Greek yoghurt"
    timeout: 15000
- assertNotVisible: "Replacing this scan"
- assertVisible: "1 to review"

# Save it from the card: back on the camera, with nothing outstanding.
- tapOn: "Greek yoghurt"
- assertVisible: "Here's what we found"
- tapOn: "Save item"
- extendedWaitUntil:
    visible: "Capture"
    timeout: 10000

# Consecutive capture carries on as normal: the retake was spent on one photo,
# so the next shot is an ordinary new item.
- runFlow:
    file: common/shoot.yaml
    env:
      FIXTURE: cheese
- extendedWaitUntil:
    visible: "Cheddar"
    timeout: 15000
- assertVisible: "1 to review"

# One "Done" goes straight to Home: there is no second camera underneath.
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Scan item"
    timeout: 10000
- assertNotVisible: "Capture"
- assertVisible: "JUST SCANNED"
- assertVisible: "Cheddar"
- assertVisible: "Greek yoghurt"
- assertNotVisible: "Milk"
